<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Recomendaciones de Comida para Perros</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif;
            background: #f5f7fb;
            min-height: 100vh;
        }
        
        .header {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            padding: 3rem 2rem;
            text-align: center;
            box-shadow: 0 4px 20px rgba(102, 126, 234, 0.2);
        }
        
        .header h1 {
            font-size: 2.8rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            letter-spacing: -0.5px;
        }
        
        .header p {
            font-size: 1.2rem;
            opacity: 0.95;
            font-weight: 300;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 2rem;
        }
        
        .search-card {
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            padding: 2.5rem;
            margin-bottom: 2rem;
        }
        
        .search-tabs {
            display: flex;
            gap: 0;
            margin-bottom: 2rem;
            background: #f8f9fc;
            border-radius: 12px;
            padding: 6px;
        }
        
        .tab {
            flex: 1;
            padding: 14px 24px;
            background: transparent;
            border: none;
            font-size: 1rem;
            font-weight: 600;
            cursor: pointer;
            color: #6b7280;
            transition: all 0.3s ease;
            border-radius: 8px;
        }
        
        .tab.active {
            background: white;
            color: #667eea;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .tab:hover:not(.active) {
            color: #667eea;
        }
        
        .search-form {
            display: none;
        }
        
        .search-form.active {
            display: block;
        }
        
        .form-group {
            margin-bottom: 1.5rem;
        }
        
        label {
            display: block;
            margin-bottom: 10px;
            color: #374151;
            font-weight: 600;
            font-size: 0.95rem;
        }
        
        select {
            width: 100%;
            padding: 14px 16px;
            border: 2px solid #e5e7eb;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.2s;
            background: white;
            color: #374151;
        }
        
        select:focus {
            outline: none;
            border-color: #667eea;
            box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.1);
        }
        
        input[type="range"] {
            width: 100%;
            height: 6px;
            background: #e5e7eb;
            border: none;
            border-radius: 5px;
            outline: none;
            cursor: pointer;
        }
        
        input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            appearance: none;
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            cursor: pointer;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
            transition: transform 0.2s;
        }
        
        input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.15);
        }
        
        input[type="range"]::-moz-range-thumb {
            width: 22px;
            height: 22px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            border-radius: 50%;
            cursor: pointer;
            border: none;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        }
        
        button[type="submit"] {
            width: 100%;
            padding: 16px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.05rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(102, 126, 234, 0.3);
        }
        
        button[type="submit"]:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(102, 126, 234, 0.4);
        }
        
        button[type="submit"]:active {
            transform: translateY(0);
        }
        
        .results-grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(380px, 1fr));
            gap: 1.5rem;
        }
        
        .result-card {
            background: white;
            border-radius: 16px;
            padding: 1.8rem;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
            transition: all 0.3s ease;
            border: 2px solid transparent;
        }
        
        .result-card:hover {
            transform: translateY(-4px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.12);
            border-color: #667eea;
        }
        
        .result-header {
            padding-bottom: 1rem;
            margin-bottom: 1.2rem;
            border-bottom: 2px solid #f3f4f6;
        }
        
        .result-header h3 {
            color: #667eea;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 0.3rem;
        }
        
        .result-badge {
            display: inline-block;
            padding: 4px 12px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .result-info {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.8rem;
            margin-bottom: 1.2rem;
        }
        
        .info-item {
            background: #f9fafb;
            padding: 12px;
            border-radius: 8px;
            border-left: 3px solid #667eea;
        }
        
        .info-item strong {
            color: #667eea;
            display: block;
            margin-bottom: 4px;
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .info-item span {
            color: #374151;
            font-size: 1rem;
            font-weight: 600;
        }
        
        .nutrition {
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
            padding: 1.2rem;
            border-radius: 10px;
            margin-top: 1.2rem;
        }
        
        .nutrition h4 {
            color: #667eea;
            margin-bottom: 1rem;
            font-size: 1rem;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }
        
        .nutrition-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 0.8rem;
        }
        
        .nutrition-item {
            text-align: center;
            padding: 12px;
            background: white;
            border-radius: 8px;
            border: 2px solid #e5e7eb;
        }
        
        .nutrition-item strong {
            display: block;
            color: #667eea;
            font-size: 1.5rem;
            font-weight: 700;
            margin-bottom: 4px;
        }
        
        .nutrition-item span {
            color: #6b7280;
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.3px;
        }
        
        .breed-notes {
            margin-top: 1.2rem;
            padding: 1rem;
            background: #fef3c7;
            border-radius: 8px;
            border-left: 4px solid #f59e0b;
        }
        
        .breed-notes strong {
            color: #92400e;
            font-weight: 700;
            font-size: 0.9rem;
        }
        
        .breed-notes p {
            color: #78350f;
            margin-top: 0.5rem;
            line-height: 1.5;
        }
        
        .no-results {
            text-align: center;
            padding: 3rem;
            color: #6b7280;
            background: white;
            border-radius: 16px;
            box-shadow: 0 2px 12px rgba(0, 0, 0, 0.08);
        }
        
        .no-results::before {
            content: "🔍";
            display: block;
            font-size: 4rem;
            margin-bottom: 1rem;
        }
        
        .loading {
            text-align: center;
            padding: 3rem;
            display: none;
        }
        
        .loading.active {
            display: block;
        }
        
        .spinner {
            border: 4px solid #e5e7eb;
            border-top: 4px solid #667eea;
            border-radius: 50%;
            width: 50px;
            height: 50px;
            animation: spin 0.8s linear infinite;
            margin: 0 auto 1rem;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        .loading p {
            color: #6b7280;
            font-weight: 500;
        }
        
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 1rem 1.2rem;
            border-radius: 10px;
            border-left: 4px solid #dc2626;
            font-weight: 500;
        }
        
        @media (max-width: 768px) {
            .search-tabs {
                flex-direction: column;
            }
            
            .results-grid {
                grid-template-columns: 1fr;
            }
            
            .header h1 {
                font-size: 2rem;
            }
        }
    </style>
</head>
<body>
    <div class="header">
        <h1>🐕 Dog Food Recommendations</h1>
        <p>Find the best nutritional recommendations for your pet</p>
    </div>
    
    <div class="container">
        <div class="search-card">
            <div class="search-tabs">
                <button class="tab active" data-tab="breed">By Breed</button>
                <button class="tab" data-tab="size">By Size</button>
                <button class="tab" data-tab="weight">By Weight</button>
            </div>
            
            <form id="breedForm" class="search-form active">
                <div class="form-group">
                    <label for="breed">Dog breed:</label>
                    <select id="breed" required>
                        <option value="">Select a breed</option>
                        {% for breed in breeds %}
                        <option value="{{ breed }}">{{ breed }}</option>
                        {% endfor %}
                    </select>
                </div>
                <button type="submit">Search Recommendations</button>
            </form>
            
            <form id="sizeForm" class="search-form">
                <div class="form-group">
                    <label for="size">Dog size:</label>
                    <select id="size" required>
                        <option value="">Select a size</option>
                        <option value="small">Small</option>
                        <option value="medium">Medium</option>
                        <option value="large">Large</option>
                    </select>
                </div>
                <button type="submit">Search Recommendations</button>
            </form>
            
            <form id="weightForm" class="search-form">
                <div class="form-group">
                    <label for="weight">Dog weight: <span id="weightValue">50</span> kg</label>
                    <input type="range" id="weight" min="5" max="100" value="50" step="0.5" required>
                    <div style="display: flex; justify-content: space-between; margin-top: 5px; font-size: 0.9em; color: #666;">
                        <span>5 kg</span>
                        <span>100 kg</span>
                    </div>
                </div>
                <button type="submit">Search Recommendations</button>
            </form>
        </div>
        
        <div class="loading">
            <div class="spinner"></div>
            <p>Searching recommendations...</p>
        </div>
        
        <div class="results-grid" id="results"></div>
    </div>
    
    <script>
        // Tab switching
        const tabs = document.querySelectorAll('.tab');
        const forms = document.querySelectorAll('.search-form');
        
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                // Remove active class from all tabs and forms
                tabs.forEach(t => t.classList.remove('active'));
                forms.forEach(f => f.classList.remove('active'));
                
                // Add active class to clicked tab
                tab.classList.add('active');
                
                // Show corresponding form
                const tabName = tab.getAttribute('data-tab');
                document.getElementById(`${tabName}Form`).classList.add('active');
                
                // Clear results
                document.getElementById('results').innerHTML = '';
            });
        });
        
        // Form submissions
        document.getElementById('breedForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const breed = document.getElementById('breed').value;
            search('breed', breed);
        });
        
        document.getElementById('sizeForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const size = document.getElementById('size').value;
            search('size', size);
        });
        
        // Weight slider update
        const weightSlider = document.getElementById('weight');
        const weightValue = document.getElementById('weightValue');
        
        weightSlider.addEventListener('input', (e) => {
            weightValue.textContent = e.target.value;
        });
        
        document.getElementById('weightForm').addEventListener('submit', (e) => {
            e.preventDefault();
            const weight = document.getElementById('weight').value;
            search('weight', weight);
        });
        
        async function search(searchType, searchValue) {
            const resultsDiv = document.getElementById('results');
            const loadingDiv = document.querySelector('.loading');
            
            // Show loading
            loadingDiv.classList.add('active');
            resultsDiv.innerHTML = '';
            
            try {
                const response = await fetch('/search', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        search_type: searchType,
                        search_value: searchValue
                    })
                });
                
                const data = await response.json();
                
                // Hide loading
                loadingDiv.classList.remove('active');
                
                if (data.error) {
                    resultsDiv.innerHTML = `<div class="error">${data.error}</div>`;
                    return;
                }
                
                if (!data.results || data.results.length === 0) {
                    resultsDiv.innerHTML = '<div class="no-results">No recommendations found for the specified criteria.</div>';
                    return;
                }
                
                // Display results
                resultsDiv.innerHTML = data.results.map(result => `
                    <div class="result-card">
                        <div class="result-header">
                            <h3>${result.breed}</h3>
                            <span class="result-badge">${result.size}</span>
                        </div>
                        <div class="result-info">
                            <div class="info-item">
                                <strong>Weight Range</strong>
                                <span>${result.weight_range}</span>
                            </div>
                            <div class="info-item">
                                <strong>Daily Portions</strong>
                                <span>${result.daily_portions}</span>
                            </div>
                            <div class="info-item">
                                <strong>Portion Size</strong>
                                <span>${result.portion_size_grams}g</span>
                            </div>
                            <div class="info-item">
                                <strong>Calories/Day</strong>
                                <span>${result.calories_per_portion * result.daily_portions}</span>
                            </div>
                        </div>
                        <div class="nutrition">
                            <h4>Nutrition per Portion</h4>
                            <div class="nutrition-grid">
                                <div class="nutrition-item">
                                    <strong>${result.protein_per_portion}%</strong>
                                    <span>Protein</span>
                                </div>
                                <div class="nutrition-item">
                                    <strong>${result.fiber_per_portion}%</strong>
                                    <span>Fiber</span>
                                </div>
                                <div class="nutrition-item">
                                    <strong>${result.fat_per_portion}%</strong>
                                    <span>Fat</span>
                                </div>
                                <div class="nutrition-item">
                                    <strong>${result.calories_per_portion}</strong>
                                    <span>Calories</span>
                                </div>
                            </div>
                        </div>
                        <div class="breed-notes">
                            <strong>💡 Breed Notes</strong>
                            <p>${result.recommendations}</p>
                        </div>
                    </div>
                `).join('');
                
            } catch (error) {
                loadingDiv.classList.remove('active');
                resultsDiv.innerHTML = `<div class="error">Error: ${error.message}</div>`;
            }
        }
    </script>
</body>
</html>
